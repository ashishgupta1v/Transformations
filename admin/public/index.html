<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🛸 SciFi Transformation Pipeline — Admin</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b0e1a;
    color: #e6e9f5;
    padding: 32px;
    max-width: 720px;
  }
  h1 { color: #f2c14e; font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #8e95b8; font-size: 13px; margin-bottom: 24px; }
  .panel {
    background: #141a2e;
    border: 1px solid #2a3356;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  label { font-size: 13px; color: #8e95b8; min-width: 110px; }
  input[type="password"], input[type="text"] {
    background: #0b0e1a;
    border: 1px solid #2a3356;
    color: #e6e9f5;
    border-radius: 6px;
    padding: 6px 10px;
    flex: 1;
    font-size: 13px;
  }
  button {
    background: #f2c14e;
    color: #1a1306;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  button.secondary { background: #2a3356; color: #e6e9f5; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  pre {
    background: #0b0e1a;
    border: 1px solid #2a3356;
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
  }
  .status-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-idle { background: rgba(142,149,184,0.2); color: #8e95b8; }
  .status-running { background: rgba(242,193,78,0.2); color: #f2c14e; }
  .status-completed { background: rgba(74,222,128,0.2); color: #4ade80; }
  .status-failed { background: rgba(248,113,113,0.2); color: #f87171; }
</style>
</head>
<body>
  <h1>🛸 SCIFI TRANSFORMATION PIPELINE — ADMIN CONTROL</h1>
  <div class="subtitle">Trigger and monitor video generation runs for any theme — deity, location, product, or business.</div>

  <div class="panel">
    <div class="row">
      <label>Admin API Key</label>
      <input type="password" id="apiKey" placeholder="leave blank if ADMIN_API_KEY unset">
    </div>
    <div class="row">
      <label>Theme</label>
      <select id="themeSelect" style="background:#0b0e1a;border:1px solid #2a3356;color:#e6e9f5;border-radius:6px;padding:6px 10px;flex:1;font-size:13px;">
        <option value="">Loading themes…</option>
      </select>
      <button class="secondary" onclick="loadThemes()">↻ Reload Themes</button>
    </div>
    <div class="row">
      <button onclick="startPipeline()" id="startBtn">▶ Start Pipeline</button>
      <button class="secondary" onclick="refreshStatus()">↻ Refresh Status</button>
      <button class="secondary" onclick="loadCosts()">💰 Load Costs</button>
    </div>
  </div>

  <div class="panel">
    <strong>Status:</strong> <span id="statusBadge" class="status-badge status-idle">idle</span>
    <pre id="statusJson">—</pre>
  </div>

  <div class="panel">
    <strong>Cost Summary</strong>
    <pre id="costsJson">—</pre>
  </div>

<script>
function headers() {
  const key = document.getElementById('apiKey').value.trim();
  const h = { 'Content-Type': 'application/json' };
  if (key) h['x-api-key'] = key;
  return h;
}

function setBadge(status) {
  const el = document.getElementById('statusBadge');
  el.textContent = status;
  el.className = 'status-badge status-' + status;
}

async function loadThemes() {
  const select = document.getElementById('themeSelect');
  select.innerHTML = '<option value="">Loading themes…</option>';
  try {
    const res = await fetch('/api/themes', { headers: headers() });
    const data = await res.json();
    const themes = data.themes || [];
    if (!themes.length) {
      select.innerHTML = '<option value="">No themes found in themes/</option>';
      return;
    }
    select.innerHTML = themes
      .map((t) => `<option value="${t.id}">${t.displayName || t.id}${t.error ? ' (invalid)' : ''}</option>`)
      .join('');
  } catch (err) {
    select.innerHTML = '<option value="">Error loading themes</option>';
  }
}

async function startPipeline() {
  const btn = document.getElementById('startBtn');
  const theme = document.getElementById('themeSelect').value;
  btn.disabled = true;
  try {
    const res = await fetch('/api/pipeline/start', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ theme }),
    });
    const data = await res.json();
    document.getElementById('statusJson').textContent = JSON.stringify(data, null, 2);
    if (data.status) setBadge(data.status);
  } catch (err) {
    document.getElementById('statusJson').textContent = 'Error: ' + err.message;
  } finally {
    setTimeout(() => { btn.disabled = false; }, 2000);
  }
}

async function refreshStatus() {
  try {
    const res = await fetch('/api/pipeline/status', { headers: headers() });
    const data = await res.json();
    document.getElementById('statusJson').textContent = JSON.stringify(data, null, 2);
    setBadge(data.status || 'idle');
  } catch (err) {
    document.getElementById('statusJson').textContent = 'Error: ' + err.message;
  }
}

async function loadCosts() {
  try {
    const res = await fetch('/api/costs', { headers: headers() });
    const data = await res.json();
    document.getElementById('costsJson').textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    document.getElementById('costsJson').textContent = 'Error: ' + err.message;
  }
}

loadThemes();
refreshStatus();
setInterval(refreshStatus, 15000);
</script>
</body>
</html>
